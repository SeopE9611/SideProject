<svg xmlns="http://www.w3.org/2000/svg" width="860" height="860" viewBox="0 0 860 860">
  <title>샬롬의집 G 로고 - 세로형</title>
  <desc>집과 물결을 결합한 샬롬의집 G 버전 세로 로고</desc>

  <g id="logo-mark" transform="translate(140,70)">
    <g id="house" fill="none" stroke="#17384D" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <path d="M90 262 L90 132 L270 20 L450 132 L450 262"/>
    </g>
    <g id="window" fill="#17384D">
      <rect x="240" y="132" width="34" height="34" rx="7"/>
      <rect x="286" y="132" width="34" height="34" rx="7"/>
      <rect x="240" y="178" width="34" height="34" rx="7"/>
      <rect x="286" y="178" width="34" height="34" rx="7"/>
    </g>
    <g id="wave" fill="none" stroke="#087E83" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 370 C128 280, 275 278, 386 320 C478 355, 575 350, 664 292"/>
    </g>
  </g>

  <text id="wordmark" x="430" y="740" text-anchor="middle"
        fill="#17384D"
        font-family="Pretendard Variable, Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"
        font-size="122" font-weight="800" letter-spacing="-4">샬롬의집</text>
</svg>