      <path d="M58 192 L58 104 L180 22 L302 104 L302 192"/>
    </g>
    <g id="window" fill="#FFFFFF">
      <rect x="148" y="98" width="26" height="26" rx="6"/>
      <rect x="186" y="98" width="26" height="26" rx="6"/>
      <rect x="148" y="136" width="26" height="26" rx="6"/>
      <rect x="186" y="136" width="26" height="26" rx="6"/>
    </g>
    <g id="wave" fill="none" stroke="#087E83" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 250 C92 180, 208 178, 292 212 C366 242, 448 240, 522 188"/>
    </g>
  </g>

  <text id="wordmark" x="570" y="233"
        fill="#FFFFFF"
        font-family="Pretendard Variable, Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"
        font-size="146" font-weight="800" letter-spacing="-5">샬롬의집</text>
</svg>