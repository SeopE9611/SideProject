<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360">
  <title>샬롬의집 G 로고 - 푸터용</title>
  <desc>어두운 배경용 밝은 로고 처리의 샬롬의집 G 버전 푸터 로고</desc>

  <g id="logo-mark" transform="translate(35,28)">
