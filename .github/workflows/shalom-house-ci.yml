name: Shalom House CI

on:
  pull_request:
    paths:
      - "shalom-house/**"
      - ".github/workflows/shalom-house-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "shalom-house/**"
      - ".github/workflows/shalom-house-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shalom-house-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  SHALOM_CONTENT_SOURCE: empty

jobs:
  quality:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: shalom-house

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: shalom-house/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
